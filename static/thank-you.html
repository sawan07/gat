<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thank you – Global Alliance Trust</title>
<link rel="icon" href="/img/gat-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Montserrat:wght@700;800&family=Lora:wght@700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light; --navy:#0b3a75; --navy-deep:#072a57; --blue:#1d7ce0; --ink:#122540; --muted:#5b6b80;
        --line:#dde6f0; --bg:#f3f7fc}
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
       font:15px/1.6 "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
  header{background:#fff; border-bottom:1px solid var(--line)}
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px; width:100%}
  .bar{height:72px; display:flex; align-items:center}
  .logo{display:flex; align-items:center; gap:10px; text-decoration:none}
  .logo img{width:52px; height:52px}
  .logo span{font-family:"Montserrat", sans-serif; font-weight:800; color:var(--navy); font-size:18px; letter-spacing:.3px}
  main{flex:1; display:grid; place-items:center; padding:48px 16px;
       background:linear-gradient(115deg, var(--navy-deep), var(--navy) 50%, var(--blue) 130%)}
  .card{background:#fff; border-radius:18px; max-width:560px; width:100%; padding:36px 28px; text-align:center;
        box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
  .tick{width:64px; height:64px; border-radius:50%; background:#e8f6ee; color:#1f9d57; display:grid; place-items:center; margin:0 auto 14px}
  h1{font-family:"Lora", Georgia, serif; color:var(--navy); margin:0 0 4px; font-size:30px}
  .script{font-family:"Dancing Script", cursive; color:var(--blue); font-size:24px; margin:0 0 14px}
  p{margin:0 0 12px; color:var(--muted)}
  .ref{font-size:13px}
  a.btn{display:inline-block; margin-top:10px; background:var(--blue); color:#fff; text-decoration:none; font-weight:700;
        border-radius:999px; padding:10px 20px}
  footer{background:var(--navy); color:#d7e3f3; font-size:12.5px; padding:16px 0}
</style>
</head>
<body>
  <header><div class="wrap bar"><a class="logo" href="/"><img src="/img/gat-logo.png" alt="" width="52" height="52"><span>GLOBAL ALLIANCE TRUST</span></a></div></header>
  <main>
    <div class="card">
      <div class="tick" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"/></svg></div>
      <h1>Thank you</h1>
      <p class="script">Serving the Community</p>
      <p>Your donation to Global Alliance Trust is complete. Thank you for supporting our community.</p>
      <p class="ref" id="ref" hidden></p>
      <a class="btn" href="/">Back to Global Alliance Trust</a>
    </div>
  </main>
  <footer><div class="wrap">© <span id="year"></span> Global Alliance Trust. All rights reserved.</div></footer>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const id = new URLSearchParams(location.search).get('donation');
  if (id && /^D\d{4,}$/.test(id)) {
    const ref = document.getElementById('ref');
    ref.textContent = 'Donation reference: ' + id;
    ref.hidden = false;
  }
</script>
</body>
</html>
